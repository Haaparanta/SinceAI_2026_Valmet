<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>a2b · Approve-to-Build Twin</title>
    <meta name="description" content="A digital twin of an industrial equipment room, built from a 3D scan one approved part at a time. Explore it in the browser, replay the build, or walk it in VR on a Meta Quest 3." />
    <meta name="theme-color" content="#0b0d14" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://twinbuild.click/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="twinbuild.click" />
    <meta property="og:url" content="https://twinbuild.click/" />
    <meta property="og:title" content="a2b · Approve-to-Build Twin" />
    <meta property="og:description" content="An equipment-room scan turned into a digital twin, one approved part at a time. Explore it in 3D or walk it in VR." />
    <meta property="og:image" content="https://twinbuild.click/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Point-cloud view of the equipment room from above, with one approved part outlined in red" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="a2b · Approve-to-Build Twin" />
    <meta name="twitter:description" content="An equipment-room scan turned into a digital twin, one approved part at a time." />
    <meta name="twitter:image" content="https://twinbuild.click/og-image.jpg" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <header id="hud">
        <span class="brand">a2b · APPROVE-TO-BUILD TWIN</span>
        <span class="badge">SYNTHETIC DATA</span>
        <div class="seg" role="group" aria-label="Source" id="source">
          <button data-source="scan" title="every kept scan point (1)">Scan</button>
          <button data-source="model" title="accepted parts only: the twin (2)">Model</button>
          <button data-source="overlay" title="twin over a faint scan (3)">Overlay</button>
          <button data-source="wireframe" title="part boxes over a faint scan (4)">Wireframe</button>
        </div>
        <div class="seg" role="group" aria-label="Snapshot style" id="style">
          <button data-style="true" title="real colours">True colour</button>
          <button data-style="redgrey" title="AGENTS.md M5: selected red, built grey, scan hidden">Red / grey</button>
        </div>
        <div class="seg" role="group" aria-label="Options">
          <button id="cut" aria-pressed="false" title="hide everything above the dollhouse cut (D); automatic from above">Cutaway</button>
          <button id="boxes" aria-pressed="false" title="wire box around every built part (B)">Boxes</button>
          <button id="snap" title="open this exact view as a snapshot page (P)">Snapshot</button>
        </div>
        <div class="seg" role="group" aria-label="VR">
          <button id="vr" disabled title="checking WebXR …">Enter VR</button>
        </div>
        <span id="stats" class="mono">loading scene.bin …</span>
      </header>
      <aside id="panel">
        <div class="panel-head">
          <span>BUILD</span>
          <span id="upto-label" class="mono"></span>
        </div>
        <input id="upto" type="range" min="0" max="0" value="0" aria-label="Built up to part" />
        <ol id="parts"></ol>
      </aside>
      <footer id="help" class="mono">drag · orbit &nbsp;|&nbsp; wheel · zoom &nbsp;|&nbsp; right-drag · pan &nbsp;|&nbsp; 1–4 · source &nbsp;|&nbsp; click a part · select + frame, Esc · clear &nbsp;|&nbsp; ←/→ · replay build &nbsp;|&nbsp; scene units (u)</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
