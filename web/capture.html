<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex, nofollow" />
    <title>a2b snapshot</title>
    <style>
      body { margin: 0; background: #05060a; }
      #wrap { position: relative; display: inline-block; }
      canvas { display: block; }
      #grid { position: absolute; inset: 0; pointer-events: none; }
      #caption {
        position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px;
        font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6e8f0;
        background: linear-gradient(transparent, rgba(5, 6, 10, 0.85) 35%);
      }
      #caption:empty { display: none; }
      #caption .title { font: 600 16px/1.3 system-ui, sans-serif; }
      #caption .sub { color: #9aa0b4; }
      #caption .legend { margin-top: 4px; color: #9aa0b4; font-size: 11px; }
      .badge {
        position: absolute; top: 12px; right: 12px; padding: 4px 12px; border-radius: 999px;
        font: 700 13px/1 ui-monospace, monospace; letter-spacing: 0.08em; color: #05060a;
      }
      .badge:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="scene"></canvas>
      <canvas id="grid"></canvas>
      <div id="badge" class="badge"></div>
      <div id="caption"></div>
    </div>
    <script type="module" src="/src/capture.ts"></script>
  </body>
</html>
