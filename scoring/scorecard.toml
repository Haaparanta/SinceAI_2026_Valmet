# Self-score against the Valmet brief rubric (brief section 06). Update at every roadmap gate.
#
# Every item is scored 0..5 and earns points * score / 5.
#   Metric items: set `value` (or pass --metrics metrics.json). The score is the number of
#                 thresholds met (value >= t, or value <= t when direction = "down").
#   Judged items: set `score` using the anchors (2 and 4 sit between the written anchors).
# A missing value or score counts as 0 and is reported as "not assessed yet".
# Thresholds are [HYPOTHESIS]: recalibrate after the first clustering run, then freeze them.

