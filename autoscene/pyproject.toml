[project]
name = "autoscene"
version = "0.1.0"
description = "Automatic object detection + room rebuild from a 3DGS PLY (Valmet x Since AI 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pillow>=10",
  "orjson>=3.10",
  "torch>=2.4",
  "torchvision>=0.19",
  "ultralytics>=8.4.0",
  "numba>=0.68.1",
  "imageio>=2.38.1",
  "imageio-ffmpeg>=0.8.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
