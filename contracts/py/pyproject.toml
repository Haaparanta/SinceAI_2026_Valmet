[project]
name = "a2b-contracts"
version = "0.1.0"
description = "Frozen a2b data contracts (pydantic v2). Source of truth: AGENTS.md S4.1. Change only via docs/CONTRACT_CHANGES.md."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a2b_contracts"]
