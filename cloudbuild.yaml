# Cloud Build: exports from the scene bucket -> image -> Artifact Registry -> Cloud Run (europe-north1).
#   make deploy                      # same pipeline from the laptop (gcloud builds submit)
#   every merge to main              # .github/workflows/deploy.yml (make deploy-github once). No keys anywhere: runs as a2b-build
# The exports are uploaded beforehand with `make publish-scene` (they are not in git): viewer/ (the manual build),
# viewer_auto/ (the automatic build) and compare.json. Only viewer/ is required.
substitutions:
  _REGION: europe-north1
  _SERVICE: a2b
  _REPO: a2b
  _SCENE_BUCKET: ${PROJECT_ID}-scene
  _RUNTIME_SA: a2b-run@${PROJECT_ID}.iam.gserviceaccount.com
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: scene
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p data/derived/viewer data/derived/viewer_auto
        gcloud storage rsync -r gs://${_SCENE_BUCKET}/viewer data/derived/viewer
        gcloud storage rsync -r gs://${_SCENE_BUCKET}/viewer_auto data/derived/viewer_auto \
          || echo "no automatic build in the bucket yet (make publish-scene uploads it)"
        gcloud storage cp gs://${_SCENE_BUCKET}/compare.json data/derived/compare.json \
          || echo "no compare.json in the bucket yet (make publish-scene uploads it)"
        test -s data/derived/viewer/scene.json || { echo "viewer/scene.json missing: run make publish-scene first"; exit 1; }
        du -sh data/derived/*

  - id: build
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}", -t, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest", .]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --concurrency=80
      - --min-instances=0
      - --max-instances=1
      - --cpu-boost
      - --set-env-vars=DEMO_MODE=0

images: ["${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}"]
timeout: 1800s
